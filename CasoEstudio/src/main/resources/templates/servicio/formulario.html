<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="general/layout :: head('Formulario Servicio')"></head>

<body>
<header th:replace="general/layout :: header"></header>
<nav th:replace="general/layout :: navbar"></nav>

<main class="container my-5">
    <div class="custom-card">
        <h3 class="mb-4" th:text="${servicio.id == null ? 'Nuevo Servicio' : 'Editar Servicio'}"></h3>

        <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required
                           placeholder="Ej: Balayage, Corte Caballero...">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required
                           placeholder="₡0.00">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Categoría</label>

                    <!-- ✅ IMPORTANTE: enviar SOLO el id -->
                    <select class="form-select" th:field="*{categoria.id}" required>
                        <option value="" disabled th:selected="${servicio.categoria == null}">Seleccione...</option>
                        <option th:each="cat : ${listaCategorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nombre}">
                        </option>
                    </select>

                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-elegance">Guardar</button>
                <a th:href="@{/servicios}" class="btn btn-outline-dark">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="general/layout :: footer"></footer>
</body>
</html>
