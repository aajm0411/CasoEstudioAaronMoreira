<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="general/layout :: head('Categorías')"></head>

<body>
<header th:replace="general/layout :: header"></header>
<nav th:replace="general/layout :: navbar"></nav>

<main class="container my-5">
    <div class="custom-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="m-0">Categorías</h3>
                <div class="hint">Organiza los servicios por tipo (Cabello, Uñas, Spa, etc.)</div>
            </div>
            <a th:href="@{/categorias/nuevo}" class="btn btn-elegance">+ Nueva</a>
        </div>

        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th style="width:90px;">ID</th>
                    <th>Nombre</th>
                    <th class="text-center" style="width:220px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${listaCategorias}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.nombre}"></td>
                    <td class="text-center">
                        <a th:href="@{'/categorias/editar/' + ${cat.id}}"
                           class="btn btn-sm btn-outline-secondary">Editar</a>

                        <a th:href="@{'/categorias/eliminar/' + ${cat.id}}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar categoría?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="general/layout :: footer"></footer>
</body>
</html>
