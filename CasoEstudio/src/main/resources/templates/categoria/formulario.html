<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="general/layout :: head('Formulario Categoría')"></head>

<body>
<header th:replace="general/layout :: header"></header>
<nav th:replace="general/layout :: navbar"></nav>

<main class="container my-5">
    <div class="custom-card">
        <h3 class="mb-4" th:text="${categoria.id == null ? 'Nueva Categoría' : 'Editar Categoría'}"></h3>

        <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Nombre de la categoría</label>
                <input type="text" th:field="*{nombre}" class="form-control" required
                       placeholder="Ej: Cabello, Uñas, Spa...">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-elegance">Guardar</button>
                <a th:href="@{/categorias}" class="btn btn-outline-dark">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="general/layout :: footer"></footer>
</body>
</html>
