<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="general/layout :: head('Contacto')"></head>

<body>
<header th:replace="general/layout :: header"></header>
<nav th:replace="general/layout :: navbar"></nav>

<main class="container my-5">
    <div class="custom-card">
        <h3 class="mb-2">Quejas y Sugerencias</h3>
        <p class="hint mb-4">Completa el formulario y nos pondremos en contacto lo antes posible.</p>

        <form th:action="@{/contacto}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input class="form-control" type="text" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input class="form-control" type="email" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Asunto</label>
                    <input class="form-control" type="text" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Mensaje</label>
                    <textarea class="form-control" rows="5" required></textarea>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-elegance" type="submit">Enviar</button>
                <a th:href="@{/}" class="btn btn-outline-dark">Volver</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="general/layout :: footer"></footer>
</body>
</html>
