<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Salón Elegance</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" />

    <style>
        body { background-color:#f4f5fb; }

        .custom-header{
            background: linear-gradient(90deg,#b993d6,#8ca6db);
            color:white; padding:32px 0; text-align:center;
        }

        .custom-navbar{
            background:#fff;
            border-bottom:1px solid #ececf6;
        }

        .custom-navbar a{
            color:#303044;
            margin-right:14px;
            text-decoration:none;
            font-weight:500;
        }

        .custom-navbar a:hover{ color:#6f42c1; }

        .custom-card{
            background:#fff;
            padding:26px;
            border-radius:18px;
            border:1px solid #ececf6; /* upgrade */
            box-shadow:0 10px 24px rgba(0,0,0,.08);
        }

        h1,h2,h3,h4,h5{ letter-spacing:.2px; } /* upgrade */

        .btn-elegance{
            background:#6f42c1;
            color:#fff;
            border:none;
        }

        .btn-elegance:hover{
            background:#59339d;
            color:#fff;
        }

        .badge.border{ border-color:#e7e7f3 !important; } /* upgrade */

        .table thead{
            background:#2b2b3a;
            color:#fff;
        }

        footer{
            background:#1e1e2f;
            color:#cfcfe6;
            padding:16px 0;
            margin-top:42px;
            text-align:center;
        }

        .hint{
            font-size:.9rem;
            color:#6c757d;
        }
    </style>
</head>

<body>

<header th:fragment="header">
    <div class="custom-header">
        <h1 class="m-0 fw-bold">Salón Elegance</h1>
        <p class="m-0">Belleza • Estilo • Bienestar</p>
    </div>
</header>

<nav th:fragment="navbar" class="custom-navbar">
    <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between">
        <div class="fw-bold">Menú</div>
        <div class="d-flex flex-wrap align-items-center">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/categorias}">Categorías</a>
            <a th:href="@{/servicios}">Servicios</a>
            <a th:href="@{/reservas}">Reservas</a>
            <a th:href="@{/contacto}">Contacto</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer">
    © 2026 Salón Elegance | Costa Rica
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</footer>

</body>
</html>
